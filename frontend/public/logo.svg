  <circle cx="250" cy="210" r="18" fill="#C1121F"/>

  <!-- Inventory Box Symbol Inside Rocket -->
  <rect x="220" y="260" width="60" height="50" rx="6" fill="#6B7280"/>
  <line x1="220" y1="285" x2="280" y2="285" stroke="#C1121F" stroke-width="4"/>
  <line x1="250" y1="260" x2="250" y2="310" stroke="#C1121F" stroke-width="4"/>

  <!-- Flame -->
