  <!-- Rocket Nose -->
  <polygon points="250,60 200,160 300,160" fill="#6B7280"/>

  <!-- Left Fin -->
  <path d="M180 260 Q120 320 190 350 L210 280 Z" fill="#6B7280"/>

  <!-- Right Fin -->
